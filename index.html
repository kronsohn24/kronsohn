<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONSOHN | Exklusive Lasergravuren & Präzision</title>

    <link rel="icon" href="B-Icon.png" type="image/png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #0f0f0f;
            --bg-card: #1a1a1a;
            --warm-yellow: #ffb000;
            --text-white: #ffffff;
            --text-muted: #a0a0a0;
            --transition: all 0.3s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header {
            padding: 15px 0;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 3px solid var(--warm-yellow);
        }

        .header-content {
            display: flex;
            justify-content: flex-end; 
            align-items: center;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            background: none;
            border: none;
            z-index: 1001;
        }

        .menu-toggle span {
            display: block;
            width: 30px;
            height: 3px;
            background: var(--warm-yellow);
            transition: var(--transition);
        }

        nav ul { display: flex; list-style: none; gap: 15px; }
        nav a { 
            text-decoration: none; 
            color: var(--warm-yellow); 
            font-weight: 600; 
            font-size: 14px; 
            padding: 8px 16px;
            border-radius: 30px;
            transition: var(--transition); 
        }
        
        nav a:hover { background: var(--warm-yellow); color: #000; }

        .hero { 
            min-height: 85vh; 
            display: flex; 
            align-items: center; 
            text-align: center; 
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('holz.jpg'); 
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            padding: 40px 0;
        }

        .hero-logo {
            max-width: 90%;
            width: 400px;
            height: auto;
            margin-bottom: 40px; 
        }

        .hero h1 { font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1.1; margin-bottom: 20px; text-transform: uppercase; }
        .hero h1 span { color: var(--warm-yellow); }
        .hero p { font-size: 1.1rem; max-width: 800px; margin: 0 auto 40px; color: var(--text-muted); }
        
        .hero-btns { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }

        .btn { padding: 14px 30px; border-radius: 40px; text-decoration: none; font-weight: 700; font-size: 14px; transition: var(--transition); display: inline-block; text-transform: uppercase; border: none; cursor: pointer; text-align: center; }
        .btn-yellow { background: var(--warm-yellow); color: #000; }
        .btn-yellow:hover { background: #e69e00; transform: translateY(-2px); }
        .btn-outline { border: 2px solid var(--warm-yellow); color: var(--warm-yellow); background: transparent; }
        .btn-outline:hover { background: var(--warm-yellow); color: #000; }
        
        section { padding: 80px 0; }
        .section-title { text-align: center; font-size: clamp(1.8rem, 6vw, 2.2rem); margin-bottom: 40px; text-transform: uppercase; color: var(--warm-yellow); }

        .about-flex { display: flex; align-items: center; gap: 50px; flex-wrap: wrap; }
        .about-text { flex: 1; min-width: 300px; }
        .about-image { flex: 1; min-width: 300px; }
        .about-image img { width: 100%; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .about-box { background: rgba(20,20,20,0.9); padding: 25px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); margin-top: 25px; }

        .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .service-card { background: rgba(20,20,20,0.9); padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); text-align: center; transition: var(--transition); }
        .service-card:hover { border-color: var(--warm-yellow); transform: translateY(-5px); }
        .service-card h3 { color: var(--warm-yellow); margin-bottom: 15px; }

        .material-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .material-item { position: relative; height: 220px; overflow: hidden; border-radius: 15px; }
        .material-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .material-item:hover img { transform: scale(1.1); }
        .material-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 15px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
        .material-overlay h3 { color: var(--warm-yellow); font-size: 1.1rem; }

        .contact-box { background: rgba(20,20,20,0.9); padding: clamp(20px, 5vw, 50px); border-radius: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; border: 1px solid rgba(255,255,255,0.08); }
        .contact-info p { margin-bottom: 10px; }
        input, select, textarea { width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.6); border: 1px solid rgba(255, 176, 0, 0.4); color: #fff; border-radius: 12px; font-family: inherit; font-size: 16px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--warm-yellow); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; overflow-y: auto; padding: 40px 15px; }
        .modal-content { max-width: 800px; margin: auto; line-height: 1.6; padding-bottom: 40px; }
        .close-btn { position: fixed; top: 15px; right: 20px; font-size: 40px; color: var(--warm-yellow); cursor: pointer; z-index: 2100; }

        #whatsapp-button { position: fixed; bottom: 20px; right: 20px; background: #25D366; color: white; padding: 12px 18px; border-radius: 50px; }

        footer { padding: 40px 0; border-top: 3px solid var(--warm-yellow); text-align: center; }

        @media (max-width: 768px) {
            .menu-toggle { display: flex; }
            nav { position: fixed; top: 0; right: -100%; width: 70%; height: 100vh; background: #000; }
            nav.active { right: 0; }
        }
    </style>
</head>
<body>

<section id="about">
    <div class="container">
        <div class="about-flex">
            <div class="about-text">
                <h2>Qualität & <span style="color: var(--warm-yellow);">Präzision</span></h2>
            </div>

            <div class="about-image">
                <!-- HIER GEÄNDERT -->
                <img src="Unsere Arbeit.png" alt="Unsere Arbeit">
            </div>

        </div>
    </div>
</section>

</body>
</html>
