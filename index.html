<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONSOHN | Exklusive Lasergravuren & Präzision</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #0f0f0f;
            --bg-card: #1a1a1a;
            --warm-yellow: #ffb000;
            --text-white: #ffffff;
            --text-muted: #a0a0a0;
            --transition: all 0.3s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* --- Header & Logo --- */
        header {
            padding: 15px 0;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 3px solid var(--warm-yellow);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo img {
            height: 40px;
            cursor: pointer;
        }

        nav ul { display: flex; list-style: none; gap: 15px; }
        nav a { 
            text-decoration: none; 
            color: var(--warm-yellow); 
            font-weight: 600; 
            font-size: 14px; 
            padding: 8px 16px;
            border-radius: 30px;
            transition: var(--transition); 
            cursor: pointer; 
        }
        nav a:hover { 
            background: var(--warm-yellow); 
            color: #000; 
        }

        /* --- Hero Section --- */
        .hero {
            height: 85vh;
            display: flex;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('holz.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .hero h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; text-transform: uppercase; }
        .hero h1 span { color: var(--warm-yellow); }
        .hero p { font-size: 1.1rem; max-width: 800px; margin: 0 auto 40px; color: var(--text-muted); }

        .btn {
            padding: 14px 30px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: var(--transition);
            display: inline-block;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
        }
        .btn-yellow { background: var(--warm-yellow); color: #000; margin-right: 15px; }
        .btn-yellow:hover { background: #f0c437; transform: translateY(-2px); }
        .btn-outline { border: 2px solid var(--warm-yellow); color: var(--warm-yellow); background: transparent; }
        .btn-outline:hover { background: var(--warm-yellow); color: #000; }

        section { padding: 100px 0; }
        .section-title { text-align: center; font-size: 2.2rem; margin-bottom: 60px; text-transform: uppercase; color: var(--warm-yellow); }

        .about-flex { display: flex; align-items: center; gap: 50px; flex-wrap: wrap; }
        .about-text { flex: 1; min-width: 300px; }
        .about-image { flex: 1; min-width: 300px; }
        .about-image img { width: 100%; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .about-box { background: rgba(20,20,20,0.9); padding: 35px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); margin-top: 25px; }

        .service-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
        .service-card {
            background: rgba(20,20,20,0.9);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            text-align: center;
            transition: var(--transition);
        }
        .service-card:hover { border-color: var(--warm-yellow); transform: translateY(-10px); }
        .service-card h3 { color: var(--warm-yellow); margin-bottom: 15px; }

        .material-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .material-item { position: relative; height: 250px; overflow: hidden; border-radius: 15px; }
        .material-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .material-item:hover img { transform: scale(1.1); }
        .material-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }

        .contact-box { 
            background: rgba(20,20,20,0.9); 
            padding: 50px; 
            border-radius: 20px; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 50px; 
            border: 1px solid rgba(255,255,255,0.08); 
        }
        input, select, textarea { 
            width: 100%; padding: 15px; margin-bottom: 15px; background: rgba(0,0,0,0.6); 
            border: 1px solid rgba(212,160,23,0.4); color: #fff; border-radius: 12px; font-family: inherit; 
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--warm-yellow); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; overflow-y: auto; padding: 50px 20px; }
        .modal-content { max-width: 800px; margin: auto; line-height: 1.8; }
        .close-btn { position: absolute; top: 20px; right: 30px; font-size: 40px; color: var(--warm-yellow); cursor: pointer; }
        .modal h2 { color: var(--warm-yellow); margin-top: 25px; margin-bottom: 10px; }
        .modal h1 { color: var(--warm-yellow); margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        #whatsapp-button { position: fixed; bottom: 25px; right: 25px; background: #25D366; color: white; padding: 12px 20px; border-radius: 50px; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 9999; transition: 0.3s; }
        #whatsapp-button:hover { transform: scale(1.05); }

        footer { padding: 50px 0; border-top: 3px solid var(--warm-yellow); text-align: center; font-size: 13px; color: #555; background: #000; }
        footer a { color: var(--warm-yellow); text-decoration: none; margin: 0 10px; cursor: pointer; font-weight: 600; }

        @media (max-width: 768px) { .hero h1 { font-size: 2.2rem; } .contact-box { grid-template-columns: 1fr; } nav { display: none; } }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo">
                <img src="B-Icon.png" alt="Logo">
            </a>
            <nav>
                <ul>
                    <li><a href="#about">ÜBER UNS</a></li>
                    <li><a href="#services">SERVICES</a></li>
                    <li><a href="#materials">MATERIALIEN</a></li>
                    <li><a href="#contact">KONTAKT</a></li>
                </ul>
            </nav>
        </div>
    </header>
