<!DOCTYPE html> 
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONSOHN | Exklusive Lasergravuren & Präzision</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="B-Icon.png">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #0f0f0f;
            --bg-card: #1a1a1a;
            --warm-yellow: #ffb000;
            --text-white: #ffffff;
            --text-muted: #a0a0a0;
            --transition: all 0.3s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header {
            padding: 15px 0;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 3px solid var(--warm-yellow);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* LOGO */
        .logo img {
            height: 45px;
            display: block;
            cursor: pointer;
        }

        .hero {
            height: 85vh;
            display: flex;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('holz.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .hero h1 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 20px; text-transform: uppercase; }
        .hero h1 span { color: var(--warm-yellow); }
        .hero p { font-size: 1.1rem; max-width: 800px; margin: 0 auto 40px; color: var(--text-muted); }

        footer { padding: 50px 0; border-top: 3px solid var(--warm-yellow); text-align: center; font-size: 13px; color: #555; background: #000; }
    </style>
</head>

<body>

<header>
    <div class="container header-content">
        <!-- Klickbares Logo -->
        <a href="#">
            <img src="logo.png" alt="KRONSOHN Logo" class="logo">
        </a>
    </div>
</header>

<section class="hero">
    <div class="container">
        <h1>Präzision trifft auf <span>Leidenschaft</span></h1>
        <p>Ihre Experten für einzigartige Personalisierung auf Metall, Holz, Leder und Kunststoff.</p>
    </div>
</section>

<footer>
    <p>©️ 2026 KRONSOHN</p>
</footer>

</body>
</html>
