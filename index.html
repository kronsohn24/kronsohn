<!DOCTYPE html> 
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KRONSOHN | Exklusive Lasergravuren & Präzision</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="B-Icon.png">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-black: #0f0f0f;
            --warm-yellow: #ffb000;
            --text-white: #ffffff;
            --text-muted: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-black);
            color: var(--text-white);
            line-height: 1.6;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        /* HEADER */
        header {
            padding: 10px 0;
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            border-bottom: 3px solid var(--warm-yellow);
        }

        .header-content {
            display: flex;
            align-items: center;
        }

        /* LOGO */
        .logo {
            display: inline-block;
        }

        .logo img {
            height: 40px;   /* Größe hier ändern wenn nötig */
            width: auto;
            display: block;
        }

        /* HERO */
        .hero {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('holz.jpg');
            background-size: cover;
            background-position: center;
        }

        .hero h1 {
            font-size: 3rem;
            text-transform: uppercase;
        }

        .hero span {
            color: var(--warm-yellow);
        }

        .hero p {
            margin-top: 15px;
            color: var(--text-muted);
        }

        /* FOOTER */
        footer {
            padding: 40px 0;
            border-top: 3px solid var(--warm-yellow);
            text-align: center;
            background: #000;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <div class="container header-content">
        <!-- Klickbares Logo -->
        <a href="#" class="logo">
            <img src="logo.png" alt="KRONSOHN Logo">
        </a>
    </div>
</header>

<section class="hero">
    <div>
        <h1>Präzision trifft auf <span>Leidenschaft</span></h1>
        <p>Ihre Experten für Gravuren auf Holz, Metall, Leder und mehr.</p>
    </div>
</section>

<footer>
    <p>©️ 2026 KRONSOHN</p>
</footer>

</body>
</html>
